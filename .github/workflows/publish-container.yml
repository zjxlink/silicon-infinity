name: Publish versioned container
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check explicit release version and license
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('node:fs');const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)throw Error('tag must match package version');if(!fs.existsSync('LICENSE'))throw Error('license required before publishing')"
      - run: npm ci
      - run: npm test
      - run: npm run test:selfhost
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          QA_OUT: qa/selfhost
      - uses: docker/setup-buildx-action@v3
      - name: Build release candidate for lifecycle checks
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: silicon-infinity:0.9.0-selfhost.1
      - name: Verify real container data and recovery before publication
        run: node scripts/container-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: qa/selfhost/
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve this repository's image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
