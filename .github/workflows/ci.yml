name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Engine and compatibility
        run: npm test
      - name: Self-hosted service
        run: npm run test:selfhost
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows with isolated server
        run: npm run test:browser
        env:
          QA_OUT: qa/selfhost
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: qa/selfhost/
          if-no-files-found: ignore
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: silicon-infinity:0.9.0-selfhost.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Isolated container lifecycle and real application data
        run: node scripts/container-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-check-results
          path: qa/selfhost/container-smoke.json
          if-no-files-found: ignore
          retention-days: 7
