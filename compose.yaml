name: silicon-infinity
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: silicon-infinity:0.9.0-selfhost.1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      SILICON_DATA_DIR: /data
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
